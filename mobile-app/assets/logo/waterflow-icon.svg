<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13B9C1"/>
      <stop offset="1" stop-color="#055A66"/>
    </linearGradient>
    <linearGradient id="water" x1="256" y1="300" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DE0EC"/>
      <stop offset="1" stop-color="#0E8C99"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M256 40 C256 40 104 232 104 344 C104 436 172 476 256 476 C340 476 408 436 408 344 C408 232 256 40 256 40 Z"/>
    </clipPath>
  </defs>

  <!-- App background (squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- soft glow accents -->
  <circle cx="430" cy="90" r="150" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="70" cy="450" r="130" fill="#04353B" opacity="0.18"/>

  <!-- White water droplet -->
  <path d="M256 40 C256 40 104 232 104 344 C104 436 172 476 256 476 C340 476 408 436 408 344 C408 232 256 40 256 40 Z" fill="#FFFFFF"/>

  <!-- Water fill + flow wave inside the droplet -->
  <g clip-path="url(#dropClip)">
    <path d="M70 338 C140 306 188 366 256 346 C322 327 360 378 442 340 L442 500 L70 500 Z" fill="url(#water)"/>
    <path d="M70 360 C150 332 196 388 270 366 C338 346 372 396 442 364 L442 500 L70 500 Z" fill="#0E8C99" opacity="0.45"/>
  </g>

  <!-- highlight -->
  <ellipse cx="206" cy="214" rx="26" ry="34" transform="rotate(-22 206 214)" fill="#FFFFFF" opacity="0.55"/>
</svg>
