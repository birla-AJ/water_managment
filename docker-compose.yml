services:
  db:
    image: postgres:16-alpine
    container_name: waterflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waterflow
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: waterflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/waterflow?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      CORS_ORIGINS: http://13.235.27.138:8080,http://localhost:8080,http://localhost:5173
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_CUSTOMER_DAILY_LIMIT: ${AI_CUSTOMER_DAILY_LIMIT:-3}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      APITXT_AUTH_KEY: ${APITXT_AUTH_KEY:-}
      APITXT_API_URL: ${APITXT_API_URL:-https://apitxt.com/api/sendOTP}
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

  admin:
    build:
      context: ./admin-dashboard
      args:
        VITE_API_URL: http://13.235.27.138:4000/api/v1
    container_name: waterflow-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  db_data:
  uploads:
